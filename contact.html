<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kseniia Kovalenko | Kontakty</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/contact.css">

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body class="contact-body">

  <nav class="nav">
    <div class="nav-container">
      <h2 class="logo">Kseniia Kovalenko</h2>
      
      <div class="nav-menu">
        <a href="index.html" class="nav-link">DOMŮ</a>
        <a href="about.html" class="nav-link">O MNĚ</a>
        <a href="portfolio.html" class="nav-link">PORTFOLIO</a>
        <a href="blog.html" class="nav-link">BLOG</a>
        <a href="contact.html" class="nav-link active">KONTAKTY</a>
      </div>
      
      <button id="hamburger" class="hamburger">
        <i class="fas fa-bars"></i>
      </button>
    </div>
   
    <div id="mobile-menu" class="mobile-menu">
      <a href="index.html">DOMŮ</a>
      <a href="about.html">O MNĚ</a>
      <a href="portfolio.html">PORTFOLIO</a>
      <a href="blog.html">BLOG</a>
      <a href="contact.html">KONTAKTY</a>
    </div>
  </nav>

  <section class="contact-section">
    <div class="contact-container">
      <h2 class="section-title" data-aos="fade-up">
        Spojme se
      </h2>
      <p class="contact-subtitle" data-aos="fade-up" data-aos-delay="100">
        Jsem otevřená novým příležitostem a spolupráci
      </p>
      
      <div class="contact-buttons" data-aos="fade-up" data-aos-delay="200">
        <button id="open-email-btn" class="btn-primary">
          <i class="fas fa-envelope"></i>
          Napsat email
        </button>
        <button id="open-linkedin-btn" class="btn-secondary">
          <i class="fab fa-linkedin"></i>
          LinkedIn
        </button>
      </div>
    </div>
  </section>

  <div id="contact-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 class="modal-title">Napište mi zprávu</h3>
      
      <form id="contact-form">
        <div class="form-group">
          <input type="text" id="name" placeholder="Vaše jméno" required autocomplete="name">
        </div>
        
        <div class="form-group">
          <input type="email" id="email" placeholder="Váš email" required autocomplete="email">
        </div>
        
        <div class="form-group">
          <textarea id="message" rows="5" placeholder="Vaše zpráva..." required></textarea>
        </div>
       
        <div class="form-actions">
          <button type="button" id="close-modal-btn" class="btn-cancel">
            Zrušit
          </button>
          <button type="submit" id="send-btn" class="btn-submit">
            Odeslat zprávu
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
